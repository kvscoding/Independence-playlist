<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>independence special Music Player</title>
    <style>
      :root {
        color-scheme: dark;
        --glass-bg: rgba(45, 24, 18, 0.85);
        --glass-border: rgba(255, 255, 255, 0.08);
        --primary-text: #ffffff;
        --secondary-text: rgba(255, 255, 255, 0.6);
        --theme-green: #25D366;
        --play-bg: #f4e8d8;
        --play-icon: #2a1510;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--primary-text);
        overflow: hidden;
        /* Updated background to the collage image you referenced */
        background: url('19028.jpg') center / cover no-repeat fixed;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* --- TOP BAR --- */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 40px 24px;
        width: 100%;
      }

      .time-display {
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 2px;
      }

      .online-status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: var(--secondary-text);
      }
      .online-dot {
        width: 8px; height: 8px;
        background-color: var(--theme-green);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--theme-green);
      }

      /* --- BOTTOM CONTAINER --- */
      .bottom-container {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 0 16px 30px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Instagram Banner */
      .insta-link {
        text-decoration: none;
        color: inherit;
        display: block;
      }
      
      .promo-banner {
        background: var(--glass-bg);
        backdrop-filter: blur(15px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .promo-banner:hover {
        transform: scale(1.02);
        background: rgba(55, 30, 22, 0.9);
      }

      .insta-icon {
        width: 48px; height: 48px;
        /* Instagram Brand Gradient */
        background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        border-radius: 14px;
        display: grid; place-items: center;
      }

      .promo-text { flex-grow: 1; }
      .promo-text h3 { font-size: 14px; margin-bottom: 4px; color: var(--primary-text); }
      .promo-text p { font-size: 12px; color: var(--secondary-text); }
      
      .follow-btn {
        background: linear-gradient(45deg, #f09433, #bc1888);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      }

      /* Music Player */
      .player {
        background: var(--glass-bg);
        backdrop-filter: blur(15px);
        border: 1px solid var(--glass-border);
        border-radius: 40px;
        padding: 12px 24px 12px 12px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .cover {
        width: 60px; height: 60px;
        border-radius: 50%;
        object-fit: cover;
        background: #111;
        flex-shrink: 0;
      }

      .track-details {
        flex-grow: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .title {
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .artist {
        font-size: 12px;
        color: var(--secondary-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 8px;
      }

      .progress-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .seek {
        flex-grow: 1;
        appearance: none;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, #fff 0 var(--progress, 0%), rgba(255,255,255,0.2) var(--progress, 0%) 100%);
        cursor: pointer;
      }
      .seek::-webkit-slider-thumb {
        appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px rgba(0,0,0,0.5);
      }

      .time-text {
        font-size: 10px;
        color: var(--secondary-text);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .controls button {
        background: none; border: none; color: white; cursor: pointer;
        display: grid; place-items: center; transition: transform 0.2s;
      }
      .controls button:hover { transform: scale(1.1); }

      .btn-play {
        width: 46px; height: 46px;
        background: var(--play-bg) !important;
        color: var(--play-icon) !important;
        border-radius: 50%;
      }
      .btn-play svg { margin-left: 2px; }
      .btn-play .pause-icon { display: none; margin: 0; }
      .playing .play-icon { display: none; }
      .playing .pause-icon { display: block; }

      #youtube-player { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

      @media (max-width: 600px) {
        .player { padding: 12px; border-radius: 30px; }
        .controls { gap: 10px; }
        .btn-play { width: 40px; height: 40px; }
        .btn-vol { display: none; }
        .time-display { font-size: 14px; }
      }
    </style>
  </head>

  <body>
    <!-- Top Bar (Cleaned up: Only Time & Online count left) -->
    <header class="top-bar">
      <div class="time-display" id="clock">2:29 AM</div>
      <div class="online-status"><div class="online-dot"></div> 251 online</div>
    </header>

    <!-- Bottom Interface -->
    <div class="bottom-container">
      
      <!-- Instagram Banner (Replaces WhatsApp) -->
      <a href="https://www.instagram.com/just_uncaffeinated?igsh=dmdnZnIxd2t0MTRw" target="_blank" class="insta-link">
        <div class="promo-banner">
          <div class="insta-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm3.98-10.822a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
            </svg>
          </div>
          <div class="promo-text">
            <h3>Follow me on Insta</h3>
            <p>@just_uncaffeinated</p>
          </div>
          <button class="follow-btn">Follow</button>
        </div>
      </a>

      <!-- Music Player -->
      <div class="player">
        <img id="cover" class="cover" src="" alt="" />
        
        <div class="track-details">
          <div class="title" id="song-title">Loading...</div>
          <div class="artist" id="artist">Please wait</div>
          <div class="progress-row">
            <input class="seek" id="seek" type="range" min="0" max="100" value="0" />
            <span class="time-text" id="time-display">0:00 / 0:00</span>
          </div>
        </div>

        <div class="controls">
          <button id="previous">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="btn-play" id="play-button">
            <svg class="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="next">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button class="btn-vol" id="vol-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
        </div>
      </div>
    </div>
    
    <div id="youtube-player"></div>

    <script>
      // Automatically keep the top-left clock accurate
      setInterval(() => {
        const now = new Date();
        document.getElementById("clock").innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      }, 1000);

      // Your YouTube Playlist ID
      const PLAYLIST_ID = "PL0Z67tlyTaWo-c_QyUnhsoa4cUwceCmRu";

      let player = null;
      let isPlaying = false;
      let isPlayerReady = false;
      let isDraggingSeek = false;
      let currentVideoId = "";
      let isMuted = true;

      const seek = document.querySelector("#seek");
      const playBtn = document.querySelector("#play-button");
      const titleEl = document.querySelector("#song-title");
      const artistEl = document.querySelector("#artist");
      const coverEl = document.querySelector("#cover");
      const timeDisplayEl = document.querySelector("#time-display");

      const formatTime = (seconds) => {
        seconds = Math.floor(seconds || 0);
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      };

      const updateUI = () => {
        playBtn.classList.toggle("playing", isPlaying);
      };

      const updateTrackInfo = () => {
        if (!player || !player.getVideoData) return;
        const data = player.getVideoData();
        if (data && data.video_id && data.video_id !== currentVideoId) {
          currentVideoId = data.video_id;
          titleEl.textContent = data.title || "Unknown Title";
          artistEl.textContent = data.author || "YouTube Channel";
          coverEl.src = `https://i.ytimg.com/vi/${data.video_id}/hqdefault.jpg`;
        }
      };

      function onYouTubeIframeAPIReady() {
        player = new YT.Player("youtube-player", {
          width: "0", height: "0",
          playerVars: {
            listType: "playlist",
            list: PLAYLIST_ID,
            controls: 0, rel: 0, modestbranding: 1, playsinline: 1, autoplay: 0, mute: 1,
            origin: window.location.origin,
          },
          events: {
            onReady: () => {
              isPlayerReady = true;
              updateTrackInfo();
            },
            onStateChange: (event) => {
              const state = event.data;
              isPlaying = state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING;
              updateUI();
              updateTrackInfo();
            }
          },
        });
      }

      playBtn.onclick = () => {
        if (!player || !isPlayerReady) return;
        if (isMuted) { player.unMute(); isMuted = false; }
        
        if (isPlaying) player.pauseVideo();
        else player.playVideo();
      };

      document.querySelector("#next").onclick = () => { if (player && isPlayerReady) player.nextVideo(); };
      document.querySelector("#previous").onclick = () => { if (player && isPlayerReady) player.previousVideo(); };
      
      document.querySelector("#vol-btn").onclick = () => {
        if (!player || !isPlayerReady) return;
        if (player.isMuted()) {
          player.unMute();
          document.querySelector("#vol-btn").style.opacity = "1";
        } else {
          player.mute();
          document.querySelector("#vol-btn").style.opacity = "0.5";
        }
      };

      seek.addEventListener("mousedown", () => isDraggingSeek = true);
      seek.addEventListener("touchstart", () => isDraggingSeek = true);

      seek.addEventListener("input", () => {
        const val = seek.value;
        seek.style.setProperty("--progress", `${val}%`);
        if (player?.getDuration()) {
          const current = (player.getDuration() * val) / 100;
          timeDisplayEl.textContent = `${formatTime(current)} / ${formatTime(player.getDuration())}`;
        }
      });

      seek.addEventListener("change", () => {
        isDraggingSeek = false;
        if (player?.getDuration()) player.seekTo((player.getDuration() * seek.value) / 100, true);
      });

      setInterval(() => {
        if (!player || !isPlayerReady || !isPlaying || isDraggingSeek) return;
        const duration = player.getDuration();
        const current = player.getCurrentTime();
        if (!duration) return;
        
        const pct = (current / duration) * 100;
        seek.value = pct;
        seek.style.setProperty("--progress", `${pct}%`);
        timeDisplayEl.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
      }, 250);

      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    </script>
  </body>
</html>
